# ---------------------------------------------------------------------------
# LIVE DRAFT BOARD
#
# What this is: your draft-day sidekick. Every time you click "Run workflow"
# it re-checks who has been drafted and shows you the best players left.
#
# How to use it during your draft:
#   1. Open the "Actions" tab of this repo in a browser tab and leave it open.
#   2. Click "2. Draft Board (run this during your draft)".
#   3. Click "Run workflow" -> "Run workflow". Takes roughly 40 seconds.
#   4. Click into the run. The board appears on the run's summary page.
#   5. Repeat whenever you want a refresh. Clicking it again cancels any run
#      still in progress, so you always get current data.
#
# Tip: keep the previous run's summary open in a second tab so you always
# have a list on screen while the new one builds.
# ---------------------------------------------------------------------------
name: 2. Draft Board (run this during your draft)

on:
  workflow_dispatch:
    inputs:
      season_year:
        description: "Season year"
        required: false
        default: "2026"
      team_name:
        description: "Optional: your exact ESPN team name, only if auto-detect fails"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: draft-board
  cancel-in-progress: true

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Keeps the last successful rankings download around between runs, so
      # if the rankings site goes down mid-draft we still have real data.
      - name: Restore cached rankings
        uses: actions/cache@v4
        with:
          path: data/rankings_cache.json
          key: rankings-${{ github.run_id }}
          restore-keys: |
            rankings-

      - name: Build the draft board
        env:
          # Optional override. Normally left unset so league.json is used.
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          SEASON_YEAR: ${{ inputs.season_year }}
          TEAM_NAME: ${{ inputs.team_name }}
        run: python scripts/draft_board.py

      # Commits the JSON files the dashboard reads. Uses [skip ci] so a data
      # commit does not kick off the test workflow every time you refresh.
      - name: Publish data to the dashboard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No dashboard data changed, nothing to publish."
            exit 0
          fi
          git commit -m "Update dashboard data [skip ci]"
          # Two runs finishing at once would collide on push, so rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Published."
              exit 0
            fi
            echo "Push rejected (attempt $attempt). Rebasing on the latest main."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep 3
          done
          echo "Could not publish dashboard data after 5 attempts."
          exit 1

      - name: Save the board as a downloadable file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-board
          path: output/*.md
          if-no-files-found: ignore

# ---------------------------------------------------------------------------
# LIVE DRAFT AUTO-REFRESH
#
# Refreshes the draft board every 5 minutes so the dashboard updates without
# you tapping anything. Meant to be switched on for one evening only.
#
# HOW TO SWITCH IT ON (about 20 seconds, in a browser)
#   1. Repository Settings > Secrets and variables > Actions
#   2. Click the "Variables" tab (NOT Secrets)
#   3. New repository variable
#        Name:  DRAFT_MODE
#        Value: on
#   4. Save. It starts refreshing within a few minutes.
#
# HOW TO SWITCH IT OFF (do this after your draft)
#   Same page, edit DRAFT_MODE to anything other than "on", or delete it.
#   Leaving it on for a whole season would spam your commit history.
#
# HONEST CAVEAT: GitHub throttles 5 minute schedules harder than any other
# interval, and delays them further when their servers are busy. Expect a
# refresh every 5 to 15 minutes in practice, not reliably every 5. Treat this
# as a background top-up and still trigger a manual run when you want the
# board current for your own pick.
# ---------------------------------------------------------------------------
name: 5. Live draft auto-refresh (draft night only)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-board
  cancel-in-progress: false

jobs:
  refresh:
    # The gate. Without DRAFT_MODE set to "on", this does nothing at all.
    if: vars.DRAFT_MODE == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cached rankings
        uses: actions/cache@v4
        with:
          path: data/rankings_cache.json
          key: rankings-${{ github.run_id }}
          restore-keys: |
            rankings-

      - name: Build the draft board
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          SEASON_YEAR: "2026"
        run: python scripts/draft_board.py

      - name: Publish data to the dashboard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No dashboard data changed, nothing to publish."
            exit 0
          fi
          git commit -m "Update draft board [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Published."
              exit 0
            fi
            echo "Push rejected (attempt $attempt). Rebasing on the latest main."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep 3
          done
          echo "Could not publish dashboard data after 5 attempts."
          exit 1

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Fantasy Companion">
  <!-- Small-size optical variant of the mark. Less padding, thicker bars, and
       higher opacity on the lower two, because at 16px the display version's
       0.42 bar disappears into the background entirely. Same three shapes,
       same lean, tuned to survive a browser tab. -->
  <g transform="rotate(-8 16 16)">
    <rect x="2.5" y="5"  width="27" height="6" rx="3" fill="#FF5A36"/>
    <rect x="2.5" y="13" width="19" height="6" rx="3" fill="#ECEEF2" opacity=".92"/>
    <rect x="2.5" y="21" width="11" height="6" rx="3" fill="#ECEEF2" opacity=".62"/>
  </g>
</svg>
